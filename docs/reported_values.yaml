# Values as printed in the submitted paper, transcribed by hand from its tables
# and figures. src/analysis/verify.py recomputes each one from the released
# per-slice decisions and reports the difference, so a claim that no longer
# holds on the data cannot quietly survive a revision.
#
# `tolerance` is the largest absolute difference that still counts as a match.
# It is set to the paper's own printing precision: a rate printed to three
# decimals matches within 0.001, a correlation printed to two within 0.01, plus
# a little slack where the quantity is a ratio of small integer counts.

table2_rates:                       # Table 2, the tumor call by stratum
  tolerance: 0.002
  columns: [sensitivity_brats_pos, specificity_brats_neg, specificity_ixi,
            balanced_accuracy_brats]
  rows:
    InternVL2.5-8B: [0.423, 0.615, 0.957, 0.519]
    Qwen2.5-VL-3B:  [0.198, 0.872, 0.707, 0.535]
    Qwen2.5-VL-7B:  [0.042, 0.984, 0.837, 0.513]
    Gemma-3-4B:     [0.619, 0.473, 0.274, 0.546]
    MedGemma-4B:    [0.424, 0.814, 0.727, 0.619]
    Gemma-4-12B:    [0.616, 0.702, 0.525, 0.659]
    GLM-4.6V-Flash: [0.637, 0.573, 0.626, 0.605]
    Qwen3.6-27B:    [0.690, 0.601, 0.690, 0.646]

